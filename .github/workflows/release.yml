name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [manifest.json]
    tags: ["*.*.*"]

permissions:
  contents: write

concurrency:
  group: minimap-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish BRAT assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${version}" ]]; then
            echo "Tag must match manifest.json version"
            exit 1
          fi
          if gh release view "${version}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${version} already exists; leaving its assets unchanged."
            exit 0
          fi
          flags=()
          if [[ "${version}" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "${version}" main.js manifest.json styles.css \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${version} — Stable Source-mode minimap" \
            --notes-file RELEASE_NOTES.md \
            "${flags[@]}"
